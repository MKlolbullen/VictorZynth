name: Capture README screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install UI and screenshot dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Expose native-only panels for documentation capture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              'src/components/PerformanceToolsSection.tsx',
              'src/components/StudioToolsSection.tsx',
          ):
              path = Path(name)
              source = path.read_text()
              source = source.replace('if (!native) return null;', 'if (false) return null;')
              path.write_text(source)
          PY

      - name: Start current UI
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/victorzynth-vite.log 2>&1 &
          echo $! > /tmp/victorzynth-vite.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/victorzynth-vite.log
          exit 1

      - name: Capture current-build UI
        run: |
          mkdir -p docs/images
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
            });

            await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' });
            await page.waitForTimeout(800);

            await page.screenshot({
              path: 'docs/images/runtime-overview.png',
              fullPage: false,
            });

            const performance = page.locator('section').filter({ hasText: 'HUM → MIDI' }).first();
            await performance.scrollIntoViewIfNeeded();
            await page.waitForTimeout(250);
            await performance.screenshot({ path: 'docs/images/runtime-performance.png' });

            const studio = page.locator('section').filter({ hasText: 'STUDIO' }).first();
            await studio.scrollIntoViewIfNeeded();
            await page.waitForTimeout(250);
            await studio.screenshot({ path: 'docs/images/runtime-studio.png' });

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Restore capture-only source edits
        run: |
          git checkout -- \
            src/components/PerformanceToolsSection.tsx \
            src/components/StudioToolsSection.tsx

      - name: Commit screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/runtime-overview.png docs/images/runtime-performance.png docs/images/runtime-studio.png
          if git diff --cached --quiet; then
            echo 'Screenshots are already current.'
            exit 0
          fi
          git commit -m 'docs: refresh current-build UI screenshots [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
