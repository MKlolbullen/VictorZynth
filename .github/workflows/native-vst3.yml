name: Native VST3 CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

jobs:
  linux-vst3:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check frontend
        run: npm run lint

      - name: Build plugin UI
        run: npm run build -- --mode plugin

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libcurl4-openssl-dev

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DAETHERWAVE_WEB_DEV_SERVER=OFF
          -DAETHERWAVE_BUILD_WEB_UI=ON

      - name: Build VST3 and Standalone
        run: cmake --build build --target VictorZynth_VST3 VictorZynth_Standalone --parallel 2

      - name: Upload Linux VST3
        uses: actions/upload-artifact@v4
        with:
          name: AetherWave-linux-vst3
          path: build/VictorZynth_artefacts/Release/VST3/AetherWave.vst3
          if-no-files-found: error
