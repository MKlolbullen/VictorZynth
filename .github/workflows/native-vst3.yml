name: Native VST3 CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: native-vst3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vst3:
    name: Linux VST3 + Standalone
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check frontend
        run: npm run lint

      - name: Build plugin UI
        run: npm run build -- --mode plugin

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libcurl4-openssl-dev

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DAETHERWAVE_WEB_DEV_SERVER=OFF
          -DAETHERWAVE_BUILD_WEB_UI=ON

      - name: Build VST3 and Standalone
        run: >-
          cmake --build build
          --target VictorZynth_VST3 VictorZynth_Standalone
          --parallel 2

      - name: Verify VST3 artifact
        run: test -d build/VictorZynth_artefacts/Release/VST3/AetherWave.vst3

      - name: Upload Linux VST3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AetherWave-linux-vst3
          path: build/VictorZynth_artefacts/Release/VST3/AetherWave.vst3
          if-no-files-found: error
