<g class="m xs">
<text x="226" y="322" fill="#6ee7b7">desc:AetherWave Wavetable Synth</text>
<text x="226" y="345" fill="#a1a1aa">slider1:0.64&lt;0,1,0.001&gt;Osc 1 WT Position</text>
<text x="226" y="368" fill="#a1a1aa">slider2:0.46&lt;0,1,0.001&gt;Osc 2 WT Position</text>
<text x="226" y="391" fill="#a1a1aa">slider3:2470&lt;20,20000,1&gt;Filter Cutoff (Hz)</text>
<text x="226" y="414" fill="#a1a1aa">slider4:0.38&lt;0,1,0.001&gt;Filter Resonance</text>
<text x="226" y="449" fill="#fbbf24">@init</text>
<text x="226" y="472">phase1 = 0; phase2 = 0;</text>
<text x="226" y="495">two_pi = 2*$pi;</text>
<text x="226" y="530" fill="#fbbf24">@slider</text>
<text x="226" y="553">cutoff = slider3;</text>
<text x="226" y="576">res = slider4;</text>
<text x="226" y="611" fill="#fbbf24">@sample</text>
<text x="226" y="634">osc = sin(phase1) * 0.55 + sin(phase2) * 0.45;</text>
<text x="226" y="657">spl0 = tanh(osc * drive); spl1 = spl0;</text>
</g>
